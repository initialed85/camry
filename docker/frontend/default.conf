server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;

    #access_log  /var/log/nginx/host.access.log  main;

    # API list responses are large JSON documents (an audio-events page is
    # megabytes), and the browser asks for gzip in every fetch. `gzip_proxied
    # any` is what makes the /api/ proxy compress: nginx only compresses
    # proxied responses that match gzip_proxied, and the API's
    # `Cache-Control: max-age=1` matches none of the defaults.
    gzip            on;
    gzip_vary       on;
    gzip_proxied    any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types      application/json text/css application/javascript text/plain;

    # The SPA shell is the document the sign-in gate intercepts, so it must always come from the
    # network. A cached shell is how a stale bundle outlives a deploy, and a service worker that
    # precaches it is how a browser stops reaching Traefik at all (see frontend/src/service-worker.ts).
    location = /index.html {
        root   /usr/share/nginx/html;
        add_header Cache-Control "no-store" always;
    }

    # No service worker ships any more (frontend/src/service-worker.ts is out of the build), and this
    # URL is answered 404 on purpose: a service-worker update check that comes back 4xx makes the
    # browser unregister whatever worker it is holding. That is the documented way to retire a worker,
    # and unlike a replacement script it needs no new JS to parse or run, so it works on a browser
    # whose precached shell never asks for anything from the network. Do not let this route fall
    # through to the SPA shell below: a 200 that is not JavaScript only confuses the update check.
    location = /service-worker.js {
        return 404;
    }

    # CRA names build assets with a content hash, so they can be cached hard; the shell cannot.
    location /static/ {
        root   /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store" always;
    }

    location /api/ {
        proxy_set_header Host $host;
        proxy_set_header Access-Control-Allow-Origin *;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_pass http://api:7070;
    }

    location ^~ /media/ {
        alias /srv/media/;
        # Segment and thumbnail names are stable after recording completes.
        # The UI only enables playback for finalized videos, so let browsers
        # reuse recently viewed media instead of downloading it again.
        add_header Cache-Control "public, max-age=604800";
    }

    #error_page  404              /404.html;

    # redirect server error pages to the static page /50x.html
    #
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }

    # proxy the PHP scripts to Apache listening on 127.0.0.1:80
    #
    #location ~ \.php$ {
    #    proxy_pass   http://127.0.0.1;
    #}

    # pass the PHP scripts to FastCGI server listening on 127.0.0.1:9000
    #
    #location ~ \.php$ {
    #    root           html;
    #    fastcgi_pass   127.0.0.1:9000;
    #    fastcgi_index  index.php;
    #    fastcgi_param  SCRIPT_FILENAME  /scripts$fastcgi_script_name;
    #    include        fastcgi_params;
    #}

    # deny access to .htaccess files, if Apache's document root
    # concurs with nginx's one
    #
    #location ~ /\.ht {
    #    deny  all;
    #}
}
